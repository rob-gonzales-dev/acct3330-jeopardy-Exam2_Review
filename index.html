<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCT 3330 Exam Review — Jeopardy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0a0f2e;
    --blue:   #1a237e;
    --mid:    #283593;
    --gold:   #ffd600;
    --gold2:  #ffab00;
    --white:  #ffffff;
    --silver: #cfd8dc;
    --green:  #00c853;
    --red:    #ff1744;
    --card-bg:#1c2461;
    --hover:  #2a3580;
    --used:   #0d1130;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  #header {
    background: linear-gradient(135deg, #0d1339 0%, #1a237e 50%, #0d1339 100%);
    border-bottom: 3px solid var(--gold);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,214,0,0.4);
  }
  #header p { font-size: 0.78rem; color: var(--silver); letter-spacing:1px; margin-top:2px; }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── SCOREBOARD ── */
  #scoreboard {
    display: flex; gap: 10px; padding: 14px 20px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow-x: auto;
    flex-wrap: wrap;
  }
  .score-card {
    background: var(--card-bg);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 110px;
    text-align: center;
    transition: all 0.3s;
    flex: 1;
  }
  .score-card.leader { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,214,0,0.3); }
  .score-card .gname {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;
    color: var(--silver); text-transform: uppercase;
  }
  .score-card .gpts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem; color: var(--gold); line-height: 1;
    transition: transform 0.2s;
  }
  .score-card.pop .gpts { transform: scale(1.3); }

  /* ── BOARD ── */
  #board-view { padding: 16px; }
  #board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .cat-header {
    background: var(--blue);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 12px 6px;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(0.85rem, 1.5vw, 1.1rem);
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    line-height: 1.2;
  }
  .cell {
    background: var(--card-bg);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.3rem, 2.5vw, 2rem);
    color: var(--gold);
    text-shadow: 0 2px 8px rgba(255,214,0,0.3);
    aspect-ratio: 1.4;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .cell::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
    pointer-events:none;
  }
  .cell:hover:not(.used) {
    background: var(--hover);
    border-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(255,214,0,0.2);
  }
  .cell.used {
    background: var(--used);
    color: transparent;
    cursor: default;
    border-color: rgba(255,255,255,0.03);
  }
  .cell.daily-double::after {
    content:'★ DD';
    position:absolute; bottom:4px; right:6px;
    font-size:0.5rem; color:var(--gold2); font-family:'DM Mono',monospace;
  }

  /* ── QUESTION MODAL ── */
  #q-overlay {
    display:none; position:fixed; inset:0;
    background: rgba(0,0,10,0.92);
    backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #q-overlay.show { display:flex; }
  #q-box {
    background: linear-gradient(160deg, #1a237e 0%, #0d1339 100%);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 32px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 0 60px rgba(255,214,0,0.15), var(--shadow);
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity:0; }
    to   { transform: scale(1);   opacity:1; }
  }
  #q-meta {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px;
  }
  #q-cat {
    font-size:0.75rem; letter-spacing:3px; color:var(--gold2);
    text-transform:uppercase; font-weight:700;
  }
  #q-pts {
    font-family:'Bebas Neue',sans-serif; font-size:2.4rem; color:var(--gold);
  }
  #q-text {
    font-size: clamp(1rem, 2vw, 1.3rem);
    line-height: 1.6;
    margin-bottom: 24px;
    color: var(--white);
  }
  #q-choices { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
  .choice {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
    cursor: default;
    transition: all 0.3s;
  }
  .choice.correct { background: rgba(0,200,83,0.2); border-color: var(--green); color: var(--green); }
  .choice.wrong   { background: rgba(255,23,68,0.15); border-color: var(--red); color: var(--red); }

  #q-answer-reveal {
    display:none;
    background: rgba(0,200,83,0.1);
    border: 2px solid var(--green);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 1rem;
    color: var(--green);
  }
  #q-answer-reveal.show { display:block; }
  #q-answer-reveal strong { font-size:1.1rem; }

  /* control buttons */
  #q-controls { display:flex; gap:10px; flex-wrap:wrap; }
  .btn {
    border:none; border-radius:10px; padding:12px 20px;
    font-family:'DM Sans',sans-serif; font-weight:700;
    font-size:0.9rem; cursor:pointer; transition:all 0.2s;
    letter-spacing:0.5px;
  }
  .btn-reveal { background: var(--gold); color: var(--navy); }
  .btn-reveal:hover { background: var(--gold2); transform:translateY(-2px); }
  .btn-correct { background: var(--green); color: var(--navy); }
  .btn-correct:hover { filter:brightness(1.1); transform:translateY(-2px); }
  .btn-wrong   { background: var(--red); color: var(--white); }
  .btn-wrong:hover { filter:brightness(1.1); transform:translateY(-2px); }
  .btn-skip    { background: rgba(255,255,255,0.1); color: var(--silver); }
  .btn-skip:hover { background: rgba(255,255,255,0.2); }

  /* group selector inside modal */
  #group-selector { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .g-btn {
    background: var(--card-bg);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 8px 14px;
    font-size:0.8rem; font-weight:700;
    cursor:pointer; color:var(--white);
    transition:all 0.2s;
    letter-spacing:0.5px;
  }
  .g-btn:hover { border-color: var(--gold); color: var(--gold); }
  .g-btn.selected { border-color: var(--gold); background: rgba(255,214,0,0.15); color: var(--gold); }

  #group-selector-label {
    font-size:0.75rem; color:var(--silver); margin-bottom:8px;
    letter-spacing:1px; text-transform:uppercase;
  }

  /* ── SETUP SCREEN ── */
  #setup-view {
    max-width:500px; margin:0 auto; padding:40px 24px;
  }
  #setup-view h2 {
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem; letter-spacing:3px; color:var(--gold);
    margin-bottom:8px;
  }
  #setup-view p { color:var(--silver); margin-bottom:24px; font-size:0.9rem; }
  .setup-group {
    background:var(--card-bg); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .setup-group label { font-size:0.8rem; color:var(--silver); width:70px; letter-spacing:1px; }
  .setup-group input {
    flex:1; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2); border-radius:8px;
    padding:8px 12px; color:var(--white); font-size:0.95rem;
    font-family:'DM Sans',sans-serif;
  }
  .setup-group input:focus { outline:none; border-color:var(--gold); }
  .btn-start {
    background: var(--gold); color:var(--navy);
    border:none; border-radius:12px;
    padding:16px 40px; font-size:1.1rem; font-weight:700;
    cursor:pointer; margin-top:16px; width:100%;
    font-family:'DM Sans',sans-serif; letter-spacing:1px;
    transition:all 0.2s;
  }
  .btn-start:hover { background:var(--gold2); transform:translateY(-2px); }

  /* ── FINAL SCREEN ── */
  #final-view { text-align:center; padding:60px 24px; }
  #final-view h2 {
    font-family:'Bebas Neue',sans-serif;
    font-size:3.5rem; letter-spacing:4px; color:var(--gold);
    margin-bottom:8px;
  }
  .winner-banner {
    background: linear-gradient(135deg, rgba(255,214,0,0.2), rgba(255,171,0,0.1));
    border:2px solid var(--gold);
    border-radius:16px; padding:20px 32px;
    display:inline-block; margin:20px auto;
    font-size:1.5rem; font-weight:700;
  }
  .final-scores {
    display:flex; flex-direction:column; gap:8px;
    max-width:400px; margin:20px auto;
  }
  .final-row {
    display:flex; justify-content:space-between;
    background:var(--card-bg); border-radius:10px;
    padding:12px 20px; border:1px solid rgba(255,255,255,0.08);
  }
  .final-row.first { border-color:var(--gold); background:rgba(255,214,0,0.1); }

  /* ── RESPONSIVE ── */
  @media(max-width:700px) {
    #board { grid-template-columns: repeat(3,1fr); }
    .cat-header { font-size:0.65rem; padding:8px 4px; }
    .cell { font-size:1.1rem; }
  }

  /* confetti */
  .confetti-piece {
    position:fixed; width:10px; height:10px;
    top:-10px; animation: fall linear forwards;
    border-radius:2px; pointer-events:none; z-index:999;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div>
    <h1>⚡ ACCT 3330 — Exam 2 Review</h1>
    <p>AUDIT JEOPARDY · DR. GONZALES · SPRING 2026</p>
  </div>
</div>

<!-- SCOREBOARD -->
<div id="scoreboard" style="display:none"></div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  VIEW 1: SETUP                                        -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="setup-view" class="view active">
  <h2>Game Setup</h2>
  <p>Enter the name for each of your 6 groups, then press Start.</p>
  <div id="group-inputs"></div>
  <button class="btn-start" onclick="startGame()">▶ Start Game</button>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  VIEW 2: BOARD                                        -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="board-view" class="view">
  <div id="board"></div>
  <div style="text-align:center; margin-top:20px;">
    <button class="btn btn-skip" onclick="showFinal()" style="padding:10px 28px;">
      🏁 End Game &amp; Show Results
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  VIEW 3: FINAL RESULTS                               -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="final-view" class="view">
  <h2>🏆 Final Results</h2>
  <div id="winner-display"></div>
  <div class="final-scores" id="final-scores-list"></div>
  <button class="btn btn-skip" onclick="location.reload()" style="margin-top:20px; padding:12px 32px;">
    🔄 Play Again
  </button>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  QUESTION MODAL                                      -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="q-overlay">
  <div id="q-box">
    <div id="q-meta">
      <span id="q-cat"></span>
      <span id="q-pts"></span>
    </div>
    <div id="q-text"></div>
    <div id="q-choices"></div>
    <div id="q-answer-reveal"></div>
    <div id="group-selector-label">Award points to:</div>
    <div id="group-selector"></div>
    <div id="q-controls">
      <button class="btn btn-reveal" id="btn-reveal" onclick="revealAnswer()">👁 Reveal Answer</button>
      <button class="btn btn-correct" id="btn-correct" onclick="scorePoints(true)" style="display:none">✓ Correct (+pts)</button>
      <button class="btn btn-wrong"   id="btn-wrong"   onclick="scorePoints(false)" style="display:none">✗ Wrong (−pts)</button>
      <button class="btn btn-skip"    onclick="closeQuestion()">Skip / Close</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  QUESTION BANK — clean choices, no hints
// ═══════════════════════════════════════════════════════════
const CATEGORIES = [
  "Ch.7\nEvidence",
  "Ch.8\nPlanning",
  "Ch.9\nRisk Model",
  "Ch.10\nFraud",
  "Ch.12\nIC & Control",
  "Ch.13\nAudit Strategy"
];

const QUESTIONS = {
  "Ch.7\nEvidence": {
    100: {
      stem: "An auditor traces shipping documents to recorded sales invoices. This direction of testing most directly addresses which assertion?",
      choices: [
        "A. Existence",
        "B. Completeness",
        "C. Valuation",
        "D. Classification"
      ],
      correct: 1,
      explain: "B. Completeness. Starting from the shipping document and tracing forward to the sales journal tests whether all shipments were recorded — that is Completeness."
    },
    200: {
      stem: "Fairfield's auditor obtains a large volume of internal sales reports but minimal external confirmations. Which characteristic of audit evidence is most directly impaired?",
      choices: [
        "A. Sufficiency",
        "B. Relevance",
        "C. Reliability",
        "D. Timeliness"
      ],
      correct: 2,
      explain: "C. Reliability. Internal documents are created and controlled by the client, which reduces their reliability as audit evidence compared to independently obtained evidence."
    },
    300: {
      stem: "Audit Data Analytics flags 47 invoices dated December 31 with shipping dates in January. Management says it is normal year-end volume. What is the auditor's most appropriate next step?",
      choices: [
        "A. Accept management's explanation since inquiry is a valid form of evidence.",
        "B. Develop an independent expectation and inspect a sample of shipping documents and contracts.",
        "C. Expand the ADA scan to the full year and conclude based on those results.",
        "D. Issue a scope limitation since the pattern cannot be explained."
      ],
      correct: 1,
      explain: "B. The ADA step of Investigating Anomalies requires the auditor to first develop an expectation, then corroborate or refute it with additional evidence such as shipping documents and customer contracts."
    },
    400: {
      stem: "An audit associate documents the following: 'Reviewed year-end revenue for cutoff issues.' Which documentation requirement is most clearly violated?",
      choices: [
        "A. The working paper must be cross-referenced to the permanent file.",
        "B. The documentation must describe the procedures performed, evidence examined, and conclusions reached.",
        "C. Working papers must be prepared by a senior auditor or above.",
        "D. The documentation is sufficient because it identifies the account and period."
      ],
      correct: 1,
      explain: "B. AU-C §230 requires that documentation be sufficient for an experienced auditor to understand what was done, what evidence was obtained, and what conclusions were reached. This entry provides none of that."
    }
  },
  "Ch.8\nPlanning": {
    100: {
      stem: "Before accepting a new engagement, the successor auditor requests permission to contact the predecessor auditor. Management refuses. What is the most appropriate response?",
      choices: [
        "A. Proceed with the engagement and perform additional procedures to compensate.",
        "B. Limit the engagement to a review instead of an audit.",
        "C. Seriously consider whether to accept the engagement.",
        "D. Accept the engagement but disclose the limitation in the audit report."
      ],
      correct: 2,
      explain: "C. Management's refusal to allow predecessor communication is a red flag about management integrity. The successor auditor should seriously consider whether to accept the engagement at all."
    },
    200: {
      stem: "Performance materiality is set at a level lower than overall materiality. What is the primary purpose of this lower threshold?",
      choices: [
        "A. To allow auditors to waive corrections for amounts below overall materiality.",
        "B. To reduce the likelihood that the combined total of uncorrected misstatements exceeds overall materiality.",
        "C. To ensure that every account balance receives the same level of testing.",
        "D. To satisfy audit committee disclosure requirements under PCAOB standards."
      ],
      correct: 1,
      explain: "B. Performance materiality creates a buffer so that even if multiple individually immaterial misstatements go uncorrected, their combined total is unlikely to exceed overall materiality."
    },
    300: {
      stem: "Fairfield's days sales outstanding increased from 45 to 48 days while bad debt expense declined in the same year. Considered together, the auditor is most concerned about which of the following?",
      choices: [
        "A. Revenue may not have been completely recorded.",
        "B. The allowance for doubtful accounts may be understated.",
        "C. Inventory turnover has declined, suggesting obsolete stock.",
        "D. Operating leverage is artificially inflating net income."
      ],
      correct: 1,
      explain: "B. Longer collection periods combined with lower bad debt expense is contradictory. It suggests the allowance for doubtful accounts is too low, understating bad debt expense and overstating net assets."
    },
    400: {
      stem: "An auditor identifies misstatements of $80K in AR, $350K in inventory, and $120K in accrued liabilities. Overall materiality is $500K. Each item was individually judged immaterial. Which concept now requires the auditor to reconsider that conclusion?",
      choices: [
        "A. Tolerable misstatement set at the individual account level.",
        "B. The aggregation of individually immaterial misstatements.",
        "C. The inherent risk associated with the accounts receivable balance.",
        "D. Performance materiality applies only to tests of controls."
      ],
      correct: 1,
      explain: "B. Individually immaterial items must be evaluated in aggregate. $80K + $350K + $120K = $550K, which exceeds overall materiality of $500K."
    }
  },
  "Ch.9\nRisk Model": {
    100: {
      stem: "The audit risk model is AR = IR × CR × DR. Inherent risk and control risk are both assessed as high, and acceptable audit risk is set at low. What is the appropriate level of planned detection risk?",
      choices: [
        "A. High, because inherent and control risk already account for most of the engagement risk.",
        "B. Low, because the auditor must gather more persuasive evidence to compensate.",
        "C. Moderate, because acceptable audit risk is always the dominant factor in the model.",
        "D. Detection risk is irrelevant when control risk is assessed at maximum."
      ],
      correct: 1,
      explain: "B. PDR = AAR ÷ (IR × CR). When AAR is low and IR × CR is high, planned detection risk must be very low, requiring more extensive and persuasive audit evidence."
    },
    200: {
      stem: "Fairfield's auditor confirms through tests of controls that payroll controls are well-designed and operating effectively. What is the most appropriate adjustment to the audit plan?",
      choices: [
        "A. Increase tests of details of balances to independently verify the TOC results.",
        "B. Accept a higher planned detection risk and reduce the extent of substantive payroll testing.",
        "C. Eliminate all substantive testing for payroll since controls have been confirmed.",
        "D. Increase acceptable audit risk since strong controls reduce overall engagement risk."
      ],
      correct: 1,
      explain: "B. When control risk is low, the auditor can accept a higher planned detection risk, which translates to less extensive substantive testing for that cycle."
    },
    300: {
      stem: "Fairfield Computers is a large publicly traded company with extensive external investor and creditor reliance on its financial statements. Compared to a small private client, how should the auditor set acceptable audit risk?",
      choices: [
        "A. Higher, because larger companies have greater resources to maintain accurate records.",
        "B. Lower, because the consequences of issuing an incorrect opinion are significantly greater.",
        "C. The same, because auditing standards require consistent application across all engagements.",
        "D. Higher, because public companies are subject to additional regulatory oversight."
      ],
      correct: 1,
      explain: "B. Acceptable audit risk reflects the level of assurance required by financial statement users. With more users relying on the statements, the auditor must accept less risk of being wrong."
    },
    400: {
      stem: "In Year 3, Fairfield's Times Interest Earned ratio was exactly 1.0, barely satisfying a loan covenant. In Year 4 it increased to 9.23. How does this historical context most directly affect Year 4 audit planning?",
      choices: [
        "A. The Year 4 improvement eliminates the prior risk factor and supports a reduction in testing.",
        "B. The Year 3 near-breach represents an incentive condition that warrants increased skepticism over Year 4 operating income.",
        "C. Because the covenant was technically satisfied in Year 3, no adjustment to Year 4 planning is required.",
        "D. The auditor should communicate the covenant history to the SEC regardless of Year 4 results."
      ],
      correct: 1,
      explain: "B. A near-miss on a covenant in Year 3 is a fraud triangle pressure condition. Management had strong incentive to ensure Year 4 results looked strong, warranting greater skepticism around operating income."
    }
  },
  "Ch.10\nFraud": {
    100: {
      stem: "Fairfield's sales manager approves customer credit limits, records sales transactions, and processes customer write-offs with no compensating control. Under the fraud triangle, which condition does this most directly illustrate?",
      choices: [
        "A. Incentive",
        "B. Opportunity",
        "C. Rationalization",
        "D. Collusion"
      ],
      correct: 1,
      explain: "B. Opportunity. The lack of segregation of duties means one person can commit and conceal a fraud, which is the defining characteristic of the Opportunity condition."
    },
    200: {
      stem: "Management's compensation includes a significant bonus tied to achieving a 15% profit margin. The company has never previously exceeded 8%. Year-end results show exactly 15.02%. Which fraud condition does this most directly represent?",
      choices: [
        "A. Opportunity arising from weak controls over the revenue cycle.",
        "B. Rationalization that minor adjustments are acceptable.",
        "C. Incentive or pressure to manipulate reported results.",
        "D. A detection risk that has not yet been addressed by audit procedures."
      ],
      correct: 2,
      explain: "C. Incentive/Pressure. A compensation structure tied directly to hitting a target — especially one never previously achieved — is a classic fraud triangle pressure condition."
    },
    300: {
      stem: "Fairfield's internal audit confirms all year-end sales transactions appear properly authorized. However, the external auditor discovers that the sales manager and credit manager coordinated to approve fictitious high-risk customers. Which inherent limitation of internal control does this illustrate?",
      choices: [
        "A. Human error due to inadequate training.",
        "B. Management override of established controls.",
        "C. Collusion between two or more employees.",
        "D. A deficiency in the overall control environment."
      ],
      correct: 2,
      explain: "C. Collusion. When two or more individuals work together, they can circumvent controls specifically designed to catch individual actors, making it an inherent limitation of any control system."
    },
    400: {
      stem: "Vertical analysis shows Fairfield's gross profit percentage increased from 17.9% to 27.85% in one year. Cost of sales grew only 6.3% while net sales grew 21%. What does this pattern most suggest to a skeptical auditor?",
      choices: [
        "A. Operations improved significantly and management's explanation should be accepted.",
        "B. Revenue may be overstated, cost of sales may be understated, or both — expanded testing is warranted.",
        "C. The NovaStar acquisition fully explains the margin improvement and no further action is needed.",
        "D. Higher margins indicate lower audit risk and justify a reduction in substantive testing."
      ],
      correct: 1,
      explain: "B. When margins spike in a way inconsistent with industry peers and prior-year trends, the auditor must investigate whether revenue was inflated or costs were deferred or improperly capitalized."
    }
  },
  "Ch.12\nIC & Control": {
    100: {
      stem: "A single accounts payable employee both approves vendor invoices and processes the related payments with no compensating control. The auditor concludes there is more than a reasonable possibility that a material misstatement would not be prevented or detected on a timely basis. This deficiency is best classified as a:",
      choices: [
        "A. Control deficiency.",
        "B. Significant deficiency.",
        "C. Material weakness.",
        "D. Inherent limitation of internal control."
      ],
      correct: 2,
      explain: "C. Material weakness. The threshold is met when there is more than a reasonable possibility that a material misstatement will not be prevented or detected on a timely basis."
    },
    200: {
      stem: "Under PCAOB AS 2201, when auditing internal control over financial reporting, the auditor uses a top-down approach. Which of the following represents the correct starting point?",
      choices: [
        "A. Testing individual transaction-level controls for the highest-dollar accounts.",
        "B. Evaluating entity-level controls, including tone at the top and board oversight.",
        "C. Identifying significant accounts and disclosures most susceptible to misstatement.",
        "D. Assessing IT general controls supporting the financial reporting system."
      ],
      correct: 1,
      explain: "B. The top-down approach begins at the top — entity-level controls, tone at the top, and the overall control environment — before drilling into specific accounts or processes."
    },
    300: {
      stem: "Management reclassified $1,000,000 of internal software development labor from SG&A expense to PP&E. No documentation of the technological feasibility milestone was provided to the audit team. Which assertion for PP&E is most directly at risk?",
      choices: [
        "A. Existence — the capitalized assets may not physically exist.",
        "B. Completeness — not all PP&E additions have been recorded.",
        "C. Valuation — the capitalized amount may not qualify under GAAP, overstating assets.",
        "D. Rights and obligations — Fairfield may not have legal title to the software."
      ],
      correct: 2,
      explain: "C. Valuation. Without documentation of the feasibility milestone, the capitalization may not meet GAAP criteria, meaning PP&E is overstated and SG&A expense is understated."
    },
    400: {
      stem: "Fairfield Computers is a privately held nonissuer. The auditor identifies a material weakness in internal control over financial reporting during the audit. What is the auditor's required action?",
      choices: [
        "A. Issue an adverse opinion on the financial statements.",
        "B. Communicate the material weakness in writing to management and those charged with governance.",
        "C. Include a separate opinion paragraph on internal control effectiveness in the audit report.",
        "D. Withdraw from the engagement since the financial statements cannot be relied upon."
      ],
      correct: 1,
      explain: "B. For nonissuers, there is no requirement to issue a separate ICFR opinion. However, auditors must communicate material weaknesses in writing to management and those charged with governance."
    }
  },
  "Ch.13\nAudit Strategy": {
    100: {
      stem: "While performing a test of controls, an auditor discovers that a $45,000 cash disbursement was processed without the required dual-approval signature. What does this exception most directly represent?",
      choices: [
        "A. A financial statement misstatement that requires a proposed correcting journal entry.",
        "B. A control deviation that indicates the likelihood of a dollar misstatement but is not itself one.",
        "C. An immaterial error that does not require follow-up since $45,000 is below performance materiality.",
        "D. Grounds to immediately issue a material weakness opinion on internal control."
      ],
      correct: 1,
      explain: "B. A TOC exception is a control deviation — it means the control did not operate as designed. It increases the likelihood that a dollar misstatement exists, but the auditor must perform substantive testing to determine whether one actually occurred."
    },
    200: {
      stem: "Substantive analytical procedures are the least expensive of the five audit test types. Under which circumstance are they most effective?",
      choices: [
        "A. Comparing total annual revenue for Year 4 against total annual revenue for Year 3.",
        "B. Comparing monthly revenue by product line and region against budget and prior-year actuals.",
        "C. Reviewing the prior-year audit workpapers to identify previously identified revenue exceptions.",
        "D. Inquiring of management about the causes of fluctuations identified during planning."
      ],
      correct: 1,
      explain: "B. Substantive analytical procedures are most effective at a granular level — monthly, by product line, by region. Annual company-wide comparisons are too broad to isolate specific misstatements."
    },
    300: {
      stem: "Fairfield has weak internal controls over the revenue cycle and high inherent risk for occurrence and cutoff assertions. Tests of controls confirm that controls are not operating effectively. Which evidence mix is most appropriate?",
      choices: [
        "A. Extensive tests of controls; limited tests of details since understanding the weakness is sufficient.",
        "B. No tests of controls; extensive substantive tests of transactions and tests of details of balances.",
        "C. Balanced equal reliance on all five test types.",
        "D. Primarily substantive analytical procedures since they are the least expensive option."
      ],
      correct: 1,
      explain: "B. Per Table 13-3: weak internal controls combined with high inherent risk leads to no TOC reliance and extensive substantive tests of transactions and tests of details of balances."
    },
    400: {
      stem: "Fairfield's Year 4 audit reveals: a profit margin more than double the industry average, DSO increasing while bad debt expense declined, unsupported Q4 expense reversals, $1M capitalized without feasibility documentation, and material cutoff exceptions in the sales working paper. Viewed together, what does this pattern most suggest?",
      choices: [
        "A. A series of isolated errors that should each be corrected individually before issuing an unmodified opinion.",
        "B. A pervasive pattern consistent with fraudulent financial reporting that requires expanding testing and reassessing fraud risk at the financial statement level.",

        "D. A going concern situation that requires the addition of an emphasis-of-matter paragraph to the report."
      ],
      correct: 1,
      explain: "B. Multiple simultaneous indicators — margin anomaly, contradictory ratio movements, unsupported reversals, and cutoff exceptions — form a pervasive pattern that triggers AU-C §240 fraud risk reassessment at the overall financial statement level."

};

const POINT_VALUES = [100, 200, 300, 400];
const DAILY_DOUBLES = [[2, 2], [4, 3]];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let groups = [];
let scores = {};
let usedCells = {};
let currentQ = null;
let currentCat = null;
let currentPts = 0;
let currentKey = null;
let selectedGroup = null;
let answerRevealed = false;

function saveState() {
  localStorage.setItem('jeopardy_state', JSON.stringify({
    groups, scores, usedCells, currentQ, currentCat, currentPts, answerRevealed
  }));
}

function loadState() {
  const s = localStorage.getItem('jeopardy_state');
  if (!s) return false;
  const d = JSON.parse(s);
  groups = d.groups; scores = d.scores; usedCells = d.usedCells;
  currentQ = d.currentQ; currentCat = d.currentCat; currentPts = d.currentPts;
  answerRevealed = d.answerRevealed;
  return true;
}

// ═══════════════════════════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════════════════════════
function initSetup() {
  const container = document.getElementById('group-inputs');
  const defaults = ['Group 1','Group 2','Group 3','Group 4','Group 5','Group 6'];
  for (let i = 0; i < 6; i++) {
    container.innerHTML += `
      <div class="setup-group">
        <label>Group ${i+1}</label>
        <input type="text" id="gname${i}" value="${defaults[i]}" placeholder="Group ${i+1} name">
      </div>`;
  }
}

function startGame() {
  groups = []; scores = {};
  for (let i = 0; i < 6; i++) {
    const name = document.getElementById(`gname${i}`).value.trim() || `Group ${i+1}`;
    groups.push(name);
    scores[name] = 0;
  }
  usedCells = {};
  saveState();
  showView('board-view');
  renderScoreboard();
  renderBoard();
}

// ═══════════════════════════════════════════════════════════
//  VIEWS
// ═══════════════════════════════════════════════════════════
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('scoreboard').style.display =
    (id === 'board-view' || id === 'final-view') ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════════════════
//  SCOREBOARD
// ═══════════════════════════════════════════════════════════
function renderScoreboard() {
  const sb = document.getElementById('scoreboard');
  const max = Math.max(...Object.values(scores));
  sb.innerHTML = groups.map(g => `
    <div class="score-card ${scores[g]===max && max>0 ? 'leader':''}" id="sc-${g.replace(/\s/g,'_')}">
      <div class="gname">${g}</div>
      <div class="gpts">${scores[g]}</div>
    </div>`).join('');
}

function animateScore(groupName) {
  const id = 'sc-' + groupName.replace(/\s/g,'_');
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 300);
}

// ═══════════════════════════════════════════════════════════
//  BOARD
// ═══════════════════════════════════════════════════════════
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = cat;
    board.appendChild(h);
  });
  POINT_VALUES.forEach((pts, pi) => {
    CATEGORIES.forEach((cat, ci) => {
      const key = `${ci}-${pi}`;
      const cell = document.createElement('div');
      cell.className = 'cell' + (usedCells[key] ? ' used' : '');
      const isDD = DAILY_DOUBLES.some(([c,p]) => c===ci && p===pi);
      if (isDD) cell.classList.add('daily-double');
      if (!usedCells[key]) {
        cell.textContent = pts;
        cell.onclick = () => openQuestion(cat, pts, ci, pi);
      }
      board.appendChild(cell);
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  QUESTION MODAL
// ═══════════════════════════════════════════════════════════
function openQuestion(cat, pts, ci, pi) {
  const q = QUESTIONS[cat][pts];
  currentQ = q; currentCat = cat; currentPts = pts;
  currentKey = `${ci}-${pi}`; selectedGroup = null; answerRevealed = false;
  const isDD = DAILY_DOUBLES.some(([c,p]) => c===ci && p===pi);
  document.getElementById('q-cat').textContent = cat.replace('\n',' — ') + (isDD ? '  ⭐ DAILY DOUBLE' : '');
  document.getElementById('q-pts').textContent = isDD ? '★ DD' : `$${pts}`;
  document.getElementById('q-text').textContent = q.stem;
  const choicesDiv = document.getElementById('q-choices');
  choicesDiv.innerHTML = q.choices.map((c,i) =>
    `<div class="choice" id="choice-${i}">${c}</div>`).join('');
  document.getElementById('q-answer-reveal').classList.remove('show');
  document.getElementById('q-answer-reveal').innerHTML = '';
  document.getElementById('btn-reveal').style.display = 'inline-block';
  document.getElementById('btn-correct').style.display = 'none';
  document.getElementById('btn-wrong').style.display = 'none';
  const gs = document.getElementById('group-selector');
  gs.innerHTML = groups.map(g =>
    `<button class="g-btn" onclick="selectGroup('${g}')">${g}</button>`).join('');
  document.getElementById('q-overlay').classList.add('show');
  saveState();
}

function selectGroup(name) {
  selectedGroup = name;
  document.querySelectorAll('.g-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
}

function revealAnswer() {
  const q = currentQ;
  answerRevealed = true;
  q.choices.forEach((c, i) => {
    const el = document.getElementById(`choice-${i}`);
    if (i === q.correct) el.classList.add('correct');
  });
  const reveal = document.getElementById('q-answer-reveal');
  reveal.innerHTML = `<strong>✓ ${q.choices[q.correct]}</strong><br><br>${q.explain}`;
  reveal.classList.add('show');
  document.getElementById('btn-reveal').style.display = 'none';
  document.getElementById('btn-correct').style.display = 'inline-block';
  document.getElementById('btn-wrong').style.display = 'inline-block';
  saveState();
}

function scorePoints(correct) {
  if (!selectedGroup) { alert('Select a group first!'); return; }
  const delta = correct ? currentPts : -Math.floor(currentPts / 2);
  scores[selectedGroup] = Math.max(0, (scores[selectedGroup] || 0) + delta);
  usedCells[currentKey] = true;
  closeQuestion();
  renderScoreboard();
  renderBoard();
  animateScore(selectedGroup);
  if (correct) spawnConfetti();
  saveState();
}

function closeQuestion() {
  document.getElementById('q-overlay').classList.remove('show');
  usedCells[currentKey] = true;
  currentQ = null;
  renderBoard();
  saveState();
}

// ═══════════════════════════════════════════════════════════
//  FINAL
// ═══════════════════════════════════════════════════════════
function showFinal() {
  showView('final-view');
  const sorted = groups.slice().sort((a,b) => scores[b]-scores[a]);
  document.getElementById('winner-display').innerHTML =
    `<div class="winner-banner">🥇 ${sorted[0]} — ${scores[sorted[0]]} pts</div>`;
  document.getElementById('final-scores-list').innerHTML = sorted.map((g,i) =>
    `<div class="final-row ${i===0?'first':''}">
      <span>${['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'][i]} ${g}</span>
      <strong>${scores[g]} pts</strong>
    </div>`).join('');
  spawnConfetti(80);
}

// ═══════════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════════
function spawnConfetti(n = 30) {
  const colors = ['#ffd600','#ffab00','#00c853','#2979ff','#ff1744','#e040fb'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg);width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 30);
  }
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
window.onload = function() {
  if (loadState() && groups.length > 0) {
    if (confirm('Resume previous game?')) {
      showView('board-view');
      renderScoreboard();
      renderBoard();
      document.getElementById('scoreboard').style.display = 'flex';
      return;
    } else {
      localStorage.removeItem('jeopardy_state');
    }
  }
  initSetup();
};
</script>
</body>
</html>
